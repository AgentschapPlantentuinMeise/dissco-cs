location /api/dissco-cs {
    auth_request /_validate_jwt;
    proxy_pass http://dissco-cs-api:8000;
}

location ~ ^/s/[^/]+/?$ {
    proxy_pass http://dissco-cs-api:8000;
}

location ~ ^/s/[^/]+/(about|help|institutions(/.*)?|contact|messageboard|my-tasks|beheer(/.*)?|collecties(/.*)?)$ {
    proxy_pass http://dissco-cs-api:8000;
}

# Built JS/CSS bundle for the dissco-cs frontend (unique prefix, see vite.config.ts).
location /cs-assets/ {
    proxy_pass http://dissco-cs-api:8000;
}
