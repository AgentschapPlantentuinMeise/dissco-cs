# Public, anonymous-friendly dissco-cs endpoints: the app itself already treats these as
# public (resolveSiteId() falls back to an anonymous slug lookup when there's no JWT), but
# without this carve-out the auth_request below would reject anonymous visitors before the
# app ever gets a chance to apply that logic.
location ~ ^/api/dissco-cs/(site-pages|announcements/active|institutions/active(/.*)?|institutions/for-project/[^/]+|contact|stats(/current)?|honour-board/[^/]+(/current)?|projects/[^/]+/progress|projects/[^/]+/manual|projects/[^/]+/manual/attachment/[^/]+)$ {
    proxy_pass http://dissco-cs-api:8000;
}

location /api/dissco-cs {
    auth_request /_validate_jwt;
    proxy_pass http://dissco-cs-api:8000;
}

location ~ ^/s/[^/]+/?$ {
    proxy_pass http://dissco-cs-api:8000;
}

location ~ ^/s/[^/]+/(about|help|institutions(/.*)?|contact|messageboard|my-dashboard|honour-board|manage(/.*)?|explore(/.*)?|review|find|login|register|forgot-password|set-password|reset-password|activate-account)$ {
    proxy_pass http://dissco-cs-api:8000;
}

# dissco-cs fork addition: rate-limit the auth JSON API (login/register/forgot-password/
# set-password) - unlike the page paths above, these are proxied straight to madoc-ts.
location ~ ^/s/[^/]+/madoc/api/auth/(login|register|forgot-password|set-password)$ {
    limit_req zone=dissco_cs_auth burst=5 nodelay;
    proxy_pass http://madoc-ts:3000;
}

# Built JS/CSS bundle for the dissco-cs frontend (unique prefix, see vite.config.ts).
location /cs-assets/ {
    proxy_pass http://dissco-cs-api:8000;
}
