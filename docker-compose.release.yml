# Op zichzelf staand compose-bestand voor het draaien van vooraf gebouwde,
# met "docker load" ingeladen images (geen build op de server nodig).
# Gebruik: docker compose -f docker-compose.release.yml [-f docker-compose.dev.yml] --env-file .env.dev up -d
# Zie docs/deploy-dev-server.md voor het volledige stappenplan.
services:

  gateway:
    image: dissco-cs/gateway:${IMAGE_TAG}
    ports:
      - "${PORTS_GATEWAY:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - tasks-api
      - model-api
      - madoc-ts
      - config-service
      - storage-api
      - okra
      - dissco-cs-api
    links:
      - tasks-api
      - model-api
      - madoc-ts
      - config-service
      - storage-api
      - okra
      - dissco-cs-api

  madoc-ts:
    tty: true
    image: dissco-cs/madoc-ts:${IMAGE_TAG}
    volumes:
      - ./var/files:/home/node/app/files
      - ./var/jwt:/home/node/app/service-jwt-responses
      - madoc-openssl-certs:/home/node/app/openssl-certs
    environment:
      - DATABASE_HOST=shared-postgres
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USER=${POSTGRES_MADOC_TS_USER}
      - DATABASE_SCHEMA=${POSTGRES_MADOC_TS_SCHEMA}
      - DATABASE_PASSWORD=${POSTGRES_MADOC_TS_PASSWORD}
      - REDIS_HOST=gateway-redis
      - API_GATEWAY=http://gateway:8080
      - GATEWAY_HOST=${GATEWAY_HOST}
      - STORAGE_FILE_DIRECTORY=/home/node/app/files
      - MADOC_INSTALLATION_CODE=${MADOC_INSTALLATION_CODE}
      - MIGRATE=true
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_USER=${MAIL_FROM_USER}
      - MADOC_INTERNAL_SUBREQUESTS=${MADOC_INTERNAL_SUBREQUESTS:-false}
      - MADOC_INTERNAL_SUBREQUESTS_MAX_DEPTH=${MADOC_INTERNAL_SUBREQUESTS_MAX_DEPTH:-5}
      - MADOC_INTERNAL_SUBREQUESTS_DEBUG=${MADOC_INTERNAL_SUBREQUESTS_DEBUG:-false}
      - SEARCH_USE_TYPESENSE=${SEARCH_USE_TYPESENSE:-true}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL:-http}
      - TYPESENSE_HOST=${TYPESENSE_HOST:-typesense}
      - TYPESENSE_PORT=${TYPESENSE_PORT:-8108}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_COLLECTION_PREFIX=${TYPESENSE_COLLECTION_PREFIX:-madoc}
    links:
      - shared-postgres
      - typesense

  tasks-api:
    tty: true
    image: ghcr.io/digirati-co-uk/tasks-api:latest
    platform: linux/amd64
    environment:
      - SERVER_PORT=3000
      - DATABASE_HOST=shared-postgres
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USER=${POSTGRES_TASKS_API_USER}
      - DATABASE_SCHEMA=${POSTGRES_TASKS_API_SCHEMA}
      - DATABASE_PASSWORD=${POSTGRES_TASKS_API_PASSWORD}
      - QUEUE_LIST=${TASKS_QUEUE_LIST}
      - REDIS_HOST=gateway-redis
    links:
      - shared-postgres
      - gateway-redis

  model-api:
    tty: true
    image: digirati/capture-models:latest
    platform: linux/amd64
    environment:
      - SERVER_PORT=3000
      - DATABASE_HOST=shared-postgres
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USER=${POSTGRES_MODELS_API_USER}
      - DATABASE_SCHEMA=${POSTGRES_MODELS_API_SCHEMA}
      - DATABASE_PASSWORD=${POSTGRES_MODELS_API_PASSWORD}
    links:
      - shared-postgres

  shared-postgres:
    image: dissco-cs/shared-postgres:${IMAGE_TAG}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MADOC_TS_USER=${POSTGRES_MADOC_TS_USER}
      - POSTGRES_MADOC_TS_SCHEMA=${POSTGRES_MADOC_TS_SCHEMA}
      - POSTGRES_MADOC_TS_PASSWORD=${POSTGRES_MADOC_TS_PASSWORD}
      - POSTGRES_TASKS_API_USER=${POSTGRES_TASKS_API_USER}
      - POSTGRES_TASKS_API_SCHEMA=${POSTGRES_TASKS_API_SCHEMA}
      - POSTGRES_TASKS_API_PASSWORD=${POSTGRES_TASKS_API_PASSWORD}
      - POSTGRES_MODELS_API_USER=${POSTGRES_MODELS_API_USER}
      - POSTGRES_MODELS_API_SCHEMA=${POSTGRES_MODELS_API_SCHEMA}
      - POSTGRES_MODELS_API_PASSWORD=${POSTGRES_MODELS_API_PASSWORD}
      - POSTGRES_CONFIG_SERVICE_USER=${POSTGRES_CONFIG_SERVICE_USER}
      - POSTGRES_CONFIG_SERVICE_SCHEMA=${POSTGRES_CONFIG_SERVICE_SCHEMA}
      - POSTGRES_CONFIG_SERVICE_PASSWORD=${POSTGRES_CONFIG_SERVICE_PASSWORD}
      - POSTGRES_SEARCH_API_USER=${POSTGRES_SEARCH_API_USER}
      - POSTGRES_SEARCH_API_SCHEMA=${POSTGRES_SEARCH_API_SCHEMA}
      - POSTGRES_SEARCH_API_PASSWORD=${POSTGRES_SEARCH_API_PASSWORD}
      - POSTGRES_DISSCO_CS_USER=${POSTGRES_DISSCO_CS_USER}
      - POSTGRES_DISSCO_CS_SCHEMA=${POSTGRES_DISSCO_CS_SCHEMA}
      - POSTGRES_DISSCO_CS_PASSWORD=${POSTGRES_DISSCO_CS_PASSWORD}
    ports:
      # Enkel lokaal op de server bereikbaar, niet extern (geen auth op dit niveau nodig).
      - "127.0.0.1:${PORTS_SHARED_POSTGRES:-5400}:5432"
    volumes:
      - ./var/shared-database:/var/lib/postgresql/data

  gateway-redis:
    image: redis:5-alpine

  config-service:
    image: dissco-cs/config-service:${IMAGE_TAG}
    environment:
      - MIGRATE=True
      - POSTGRES_HOST=shared-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_CONFIG_SERVICE_USER}
      - POSTGRES_PASSWORD=${POSTGRES_CONFIG_SERVICE_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_CONFIG_SERVICE_SCHEMA}
      - POSTGRES_DB=${POSTGRES_DB}
    links:
      - shared-postgres
    volumes:
      - ./configuration/schemas:/app/configurator/schemas
      - ./configuration/defaults:/app/configurator/default_config

  dissco-cs-api:
    image: dissco-cs/dissco-cs-api:${IMAGE_TAG}
    environment:
      - MIGRATE=true
      - POSTGRES_HOST=shared-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_DISSCO_CS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DISSCO_CS_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_DISSCO_CS_SCHEMA}
      - POSTGRES_DB=${POSTGRES_DB}
      - MADOC_GATEWAY_URL=http://gateway:8080
      - MADOC_SERVICE_JWT_PATH=/app/service-jwt-responses/dissco-cs-api.json
      # Read-only reuse of the tasks-api service's own DB credentials, for the honour-board
      # leaderboard (queries tasks_api.tasks directly, see honour-board.repository.ts).
      - POSTGRES_TASKS_API_USER=${POSTGRES_TASKS_API_USER}
      - POSTGRES_TASKS_API_PASSWORD=${POSTGRES_TASKS_API_PASSWORD}
      - POSTGRES_TASKS_API_SCHEMA=${POSTGRES_TASKS_API_SCHEMA}
      # Read-only reuse of madoc-ts's own DB credentials, for the volunteer count
      # (queries madoc_ts."user"/site_permission directly, see madoc-users.repository.ts).
      - POSTGRES_MADOC_TS_USER=${POSTGRES_MADOC_TS_USER}
      - POSTGRES_MADOC_TS_PASSWORD=${POSTGRES_MADOC_TS_PASSWORD}
      - POSTGRES_MADOC_TS_SCHEMA=${POSTGRES_MADOC_TS_SCHEMA}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_USER=${MAIL_FROM_USER}
    volumes:
      - ./var/jwt:/app/service-jwt-responses
    links:
      - shared-postgres

  storage-api:
    tty: true
    image: ghcr.io/digirati-co-uk/storage-api:main
    platform: linux/amd64
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST}
    volumes:
      - ./var/files/storage-api:/home/node/app/files
    links:
      - shared-postgres

  typesense:
    image: typesense/typesense:0.25.2
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors"
    ports:
      - "127.0.0.1:${PORTS_TYPESENSE:-8108}:8108"
    volumes:
      - ./var/typesense:/data

  typesense-dashboard:
    image: bfritscher/typesense-dashboard:latest
    restart: on-failure
    ports:
      - "127.0.0.1:8109:80"

  search:
    image: ghcr.io/digirati-co-uk/madoc-search-service:247f854b1258e3971907e6912cef2374a1da8474
    platform: linux/amd64
    environment:
      - BROWSABLE=False
      - USE_DOCKER=yes
      - IPYTHONDIR=/app/.ipython
      - MIGRATE=True
      - LOAD=False
      - DEBUG=True
      - DJANGO_DEBUG=True
      - WAITRESS=False
      - POSTGRES_HOST=shared-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_SEARCH_API_USER}
      - POSTGRES_PASSWORD=${POSTGRES_SEARCH_API_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_SEARCH_API_SCHEMA}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgres://${POSTGRES_SEARCH_API_USER}:${POSTGRES_SEARCH_API_PASSWORD}@shared-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    links:
      - shared-postgres

  okra:
    image: digirati/okra:latest
    platform: linux/amd64

volumes:
  # Door Docker zelf beheerd (i.p.v. een hostmap) zodat de rechten van de node-gebruiker
  # (UID 1000) uit de image altijd correct zijn, ongeacht welke gebruiker/UID op de VM
  # draait -- geen manuele chown meer nodig bij een nieuwe/hergebruikte hostmap.
  madoc-openssl-certs:
